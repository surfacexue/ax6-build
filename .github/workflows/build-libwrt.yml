name: Build AX6 LibWrt NSS Firmware
# 平行分支：用 LiBwrt/LibWrt 25.12-nss（内核 6.12.116）替代 qosmio 25.12-nss（6.12.91）。
#
# 与主线 build.yml 的差别（都是有意的）：
#   1. 不需要设备补丁：LibWrt 树里原生就有 Device/redmi_ax6-stock
#   2. 不需要换 luci feed：它的 feeds.conf.default 已指向 immortalwrt openwrt-25.12
#   3. 不需要换 golang：同上，packages feed 自带够新的 Go
#   4. 不需要改 luci-ssl-openssl 依赖：树内有 package/utils/px5g-openssl
#   5. 配置换成 libwrt/configs/libwrt-ax6.config（NSS 段取自已验证的纯净版）
#
# 只支持手动触发：本文件不进 push 触发路径，不会被无意跑起来。
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'LibWrt 分支/标签'
        required: false
        default: '25.12-nss'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: libwrt-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 350
    env:
      SOURCE_REPO: LiBwrt/LibWrt
      SOURCE_REF: ${{ github.event.inputs.source_ref || '25.12-nss' }}
      EXTRAPKG_REPO: TerryLip/AX6NSS-qosmio
      EXTRAPKG_REF: qualcommax-6.x-nss-wifi
      # rules.mk 会把 CCACHE_DIR 覆盖成 $(TOPDIR)/.ccache，这里必须指向同一个真实目录
      CCACHE_DIR: /mnt/ax6build/openwrt/.ccache

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          uname -a
          echo "CPU 核心: $(nproc)"
          free -h
          df -h /

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/microsoft \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo apt-get -y purge -qq '^llvm-.*' '^mysql-.*' '^php.*' 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget subversion ccache time
          df -h /

      - name: 拉取 LibWrt 源码
        run: |
          BUILD_ROOT=/mnt/ax6build
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_ROOT"
          echo "--- 磁盘 ---"
          df -h / /mnt
          echo "源码: $SOURCE_REPO  分支: $SOURCE_REF"
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/$SOURCE_REPO.git" "$BUILD_ROOT/openwrt"
          ln -sfn "$BUILD_ROOT/openwrt" openwrt
          cd openwrt
          echo "--- 源码 HEAD ---"
          git log -1 --oneline
          echo "--- 内核版本 ---"
          cat target/linux/generic/kernel-6.12 2>/dev/null | head -2
          echo "--- mac80211 backports 版本 ---"
          sed -n 's/^PKG_VERSION:=//p' package/kernel/mac80211/Makefile | head -1
          echo "--- 是否自带 redmi_ax6-stock ---"
          grep -c 'Device/redmi_ax6-stock' target/linux/qualcommax/image/ipq807x.mk
          du -sh .

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ax6build/openwrt/.ccache
          key: ccache-libwrt2512-${{ github.run_id }}
          restore-keys: |
            ccache-libwrt2512-

      - name: 更新 feeds
        run: |
          # ccache 容量钉住（本树 rules.mk 强制不压缩），放在恢复之后避免被旧 ccache.conf 覆盖
          mkdir -p /mnt/ax6build/openwrt/.ccache
          ccache --max-size=4G
          (ccache --show-config 2>/dev/null || ccache -p) | grep -iE 'max_size|compress' || true

          cd openwrt
          if [ -f feeds.conf ]; then rm -f feeds.conf; fi
          echo "--- feeds.conf.default（应已含 immortalwrt 25.12 与 nss_packages）---"
          grep -E '^src-git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- nss_packages 是否就位 ---"
          ls -d feeds/nss_packages 2>/dev/null || { echo "::error::feeds 里没有 nss_packages"; exit 1; }
          ls feeds/nss_packages | head -20

      - name: 并入第三方包并注入首启脚本
        run: |
          set -e
          cd openwrt

          # 1) openclash 内核、turboacc 等只在第三方树里维护，整目录并入
          git clone --depth 1 --branch "$EXTRAPKG_REF" \
            "https://github.com/$EXTRAPKG_REPO.git" /tmp/extrapkg
          mkdir -p package/new package/emortal
          cp -a /tmp/extrapkg/package/new/. package/new/
          cp -a /tmp/extrapkg/package/emortal/. package/emortal/
          echo "--- 并入的目录 ---"
          ls package/new package/emortal

          # 1a) vlmcsd 的 PKG_MIRROR_HASH 写死的是 2020 年那份 tarball 的 sha256。
          #     它带 debian/docker 两个 submodule，dl_github_archive.py 不支持 submodule，
          #     fallback 用 git clone+archive 重新打包，内容必然与当年不同 →
          #     download.pl 校验 hash 不过就删档重试，最终 Error 1（主线 run #12 即死于此）。
          #     源码版本仍钉死在 e599080，submodule 只是打包辅助目录、不参与产物，
          #     所以把镜像校验改成 skip（该值是 OpenWrt 下载脚本支持的）。
          sed -i 's|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|' package/new/vlmcsd/Makefile
          grep -E '^PKG_(SOURCE_VERSION|MIRROR_HASH)' package/new/vlmcsd/Makefile

          # 2) mosdns 的界面在 sbwml 仓库（immortalwrt 只带本体）
          git clone --depth 1 --branch v5 \
            https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns
          cp -a /tmp/mosdns/luci-app-mosdns package/
          cp -a /tmp/mosdns/geo2txt package/
          echo "--- mosdns 界面 ---"
          sed -n 's/^PKG_VERSION:=//p' package/luci-app-mosdns/Makefile
          grep -E '^LUCI_DEPENDS' package/luci-app-mosdns/Makefile || true

          # 3) 首启脚本：NSS 与 nft flow offloading 互斥，必须把软件流表关掉，
          #    否则 fw4 的 flowtable 会抢走已建立连接，ECM 永远看不到回程方向，
          #    accelerated_count 会一直是 0（见 llz121517 的实测结论）。
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-nss-offload <<'EOF'
          #!/bin/sh
          # NSS/ECM 依赖自己接管连接；nft 软件 flowtable 会把连接从 ECM 手里抢走。
          uci -q set firewall.@defaults[0].flow_offloading='0'
          uci -q set firewall.@defaults[0].flow_offloading_hw='0'
          uci -q commit firewall
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-nss-offload
          echo "--- 首启脚本 ---"
          cat files/etc/uci-defaults/99-nss-offload

      - name: 校验源码树前提
        run: |
          set -e
          cd openwrt

          test -f feeds/luci/luci.mk || { echo "::error::feeds/luci/luci.mk 缺失"; exit 1; }
          grep -q 'LUCI_UT_MIN_UCODE' feeds/luci/luci.mk \
            && echo "::warning::luci.mk 含 ucode 字节码约束，需确认本树 ucode 版本" || true

          # px5g-openssl：LibWrt 树内有，所以 luci-ssl-openssl 不需要改依赖
          if [ -f package/utils/px5g-openssl/Makefile ]; then
            echo "OK  px5g-openssl 存在，luci-ssl-openssl 可直接用"
          else
            SSL_MK=feeds/luci/collections/luci-ssl-openssl/Makefile
            if [ -f "$SSL_MK" ] && grep -q '+px5g-openssl' "$SSL_MK"; then
              sed -i 's#+px5g-openssl#+openssl-util#' "$SSL_MK"
              echo "已兜底修正：+px5g-openssl -> +openssl-util"
            fi
          fi

          # tailscale：需要 Go >= 1.27（go.mod 声明 go 1.27.3 + tool 块）
          if [ -d feeds/packages/lang/golang/golang1.27 ]; then
            echo "OK  自带 golang1.27"
          else
            echo "::warning::feeds/packages 里没有 golang1.27，tailscale 可能编不过"
            ls feeds/packages/lang/golang | head
          fi

          # argon：界面与现系统一致的前提
          if [ -d feeds/luci/themes/luci-theme-argon ] || [ -d package/new/luci-theme-argon ]; then
            echo "OK  argon 主题存在"
          else
            echo "::error::argon 主题缺失"; exit 1
          fi

      - name: 应用编译配置
        run: |
          cp libwrt/configs/libwrt-ax6.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- 目标设备 ---"
          # 两种写法都要认：本线配置开了 CONFIG_TARGET_MULTI_PROFILE=y，defconfig 之后
          # 只会留下 CONFIG_TARGET_DEVICE_<target>_DEVICE_<dev>=y（每设备选型），老的
          # CONFIG_TARGET_<target>_DEVICE_<dev>=y（单 profile）根本不生成。run #1 就是
          # 只认了老符号，明明选上了设备却被判「未启用」而中止。
          grep -E '^CONFIG_(TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock|TARGET_DEVICE_qualcommax_ipq807x_DEVICE_redmi_ax6-stock)=y' .config || {
            echo "::error::redmi_ax6-stock 未启用"; exit 1; }
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x|PROFILE|DEVICE_)' .config | head -8 || true
          echo "--- NSS 内存 profile（必须是 MEDIUM）---"
          grep -E '^CONFIG_NSS_MEM_PROFILE_' .config || true

      # 与主线同一套自检：defconfig 静默丢弃树里没有的包。LibWrt 的配置仍请求
      # luci-app-turboacc + kmod-nft-fullcone（ImmortalWrt 系树里通常有，但不是必然），
      # 一旦 kmod 被丢弃，turboacc 的 ipk 依赖会让编译在最后阶段白炸 4 小时。
      # 这里检测到就把 turboacc 整包关掉（它少了 fullcone 也只剩 offload/BBR，主线已证明不值得冒险）。
      - name: 自检配置是否被静默丢弃
        run: |
          set +e
          cd openwrt
          list_req() { grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$1" \
                         | sed -E 's/^CONFIG_PACKAGE_(.*)=y$/\1/' | sort -u; }
          list_req ../libwrt/configs/libwrt-ax6.config > /tmp/req.txt
          list_req .config > /tmp/got.txt
          comm -23 /tmp/req.txt /tmp/got.txt > /tmp/dropped.txt
          req=$(wc -l < /tmp/req.txt); got=$(wc -l < /tmp/got.txt); n=$(wc -l < /tmp/dropped.txt)
          echo "请求 $req 个包 → 进 .config $got 个，被静默丢弃 $n 个"
          if [ "$n" -gt 0 ]; then
            echo "--- 丢弃清单 ---"; cat /tmp/dropped.txt
            echo "::warning::$n 个包请求了但树里没有（见 Summary 表格）"
            { echo "### 配置被静默丢弃的包（$n）"; echo
              echo "| 包 |"; echo "|---|"
              sed 's/^/| `/' /tmp/dropped.txt | sed 's/$/` |/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OK  没有任何请求的包被丢弃"
          fi
          if grep -qx 'kmod-nft-fullcone' /tmp/dropped.txt; then
            echo "::warning::kmod-nft-fullcone 不在本树内 → 关闭 luci-app-turboacc，避免 package/install 阶段依赖失败"
            sed -i -e 's|^CONFIG_PACKAGE_luci-app-turboacc=y|# CONFIG_PACKAGE_luci-app-turboacc is not set|' \
                   -e 's|^\(CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_.*\)=y|\# \1 is not set|' \
                   -e 's|^CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn=y|# CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn is not set|' \
                   -e 's|^CONFIG_PACKAGE_kmod-nft-fullcone=y|# CONFIG_PACKAGE_kmod-nft-fullcone is not set|' .config
            grep -nE 'turboacc|kmod-nft-fullcone' .config | head -10 || true
          fi

      - name: 校验核心功能包已启用
        run: |
          set +e
          cd openwrt
          FAIL=0
          check() {
            if grep -qE "^CONFIG_PACKAGE_$1=y" .config; then
              echo "OK    $1  ($2)"
            else
              echo "::error::$1 未启用（$2）"; FAIL=1
            fi
          }
          warn() {
            if grep -qE "^CONFIG_PACKAGE_$1=y" .config; then
              echo "OK    $1"
            else
              echo "::warning::$1 未进入最终 config"
              echo "- ⚠️ $1 未启用" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "===== 硬性要求：NSS 与数据面 ====="
          check kmod-qca-ssdk "SSDK"
          check kmod-qca-nss-dp "NSS 数据面入口"
          check kmod-qca-nss-drv "NSS 核心驱动"
          check kmod-qca-nss-ecm "ECM，不装等于没加速"
          check nss-firmware-ipq807x "NSS 固件"

          echo "===== 硬性要求：外网访问 ====="
          check kmod-wireguard "WireGuard 内核模块"
          check wireguard-tools "wg 命令"
          check luci-proto-wireguard "LuCI WireGuard 页"
          check tailscale "tailscale"
          check kmod-tun "/dev/net/tun"
          check luci-base "LuCI 核心"

          echo "===== 预期增强项（缺失只告警）====="
          warn kmod-qca-nss-drv-pppoe
          warn kmod-nss-ifb
          warn luci-ssl-openssl
          warn kmod-nft-fullcone
          warn kmod-nf-nathelper
          warn luci-theme-argon
          warn luci-app-openclash
          warn luci-app-mosdns
          warn mosdns
          warn luci-app-turboacc
          warn luci-app-vlmcsd
          warn luci-app-cpufreq
          warn luci-app-ddns
          warn luci-app-wol
          warn luci-app-upnp
          warn sqm-scripts-nss
          warn etherwake
          warn miniupnpd-nftables
          warn kmod-fs-ntfs3

          # 非 PACKAGE_ 前缀的符号单独判
          if grep -qE '^CONFIG_MAC80211_NSS_SUPPORT=y' .config; then
            echo "OK    MAC80211_NSS_SUPPORT（WiFi 走 NSS）"
          else
            echo "::warning::MAC80211_NSS_SUPPORT 未启用，WiFi 可能不走 NSS"
            echo "- ⚠️ MAC80211_NSS_SUPPORT 未启用" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::核心功能缺失，终止编译"
            exit 1
          fi

      # dl/ 是纯输入，缓存安全；LibWrt 的 tarball 与 qosmio 不同，首轮必然全量下载
      - name: 恢复 dl 缓存
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ax6build/openwrt/dl
          key: dl-libwrt-${{ hashFiles('libwrt/configs/libwrt-ax6.config') }}-${{ hashFiles('.github/workflows/build-libwrt.yml') }}
          restore-keys: |
            dl-libwrt-
            dl-

      - name: 下载依赖源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail
          echo "== 并行编译 (nproc=$(nproc)) =="
          if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "并行编译成功"; exit 0
          fi
          echo "== 并行失败，串行 V=s 重试 =="
          cp /tmp/build.log /tmp/build_parallel.log
          free -h; df -h /
          timeout 45m make -j1 V=s 2>&1 | tee /tmp/build_serial.log || true
          cp /tmp/build_serial.log /tmp/build.log
          exit 1

      - name: 失败诊断
        if: failure() || cancelled()
        run: |
          set +e   # 诊断步一旦自己非 0，后面的 Summary/artifact 就全丢（run #1 的教训）
          LOG=/tmp/build.log
          [ -f "$LOG" ] || LOG=/tmp/build_serial.log
          # 失败发生在编译之前（配置/校验步）时两个日志都不存在；此处必须兜底，
          # 否则后面 tail 一个不存在的文件会让本步自己也 exit 1，
          # logs 分支与日志 artifact 全都不产出（run #1 就是这样丢了全部日志）。
          if [ ! -f "$LOG" ]; then
            {
              echo "## LibWrt 编译失败诊断"
              echo ""
              echo "编译未启动：失败发生在前面的配置/校验步骤，没有 build.log。"
              echo "请查看该 job 的 Annotations（::error:: 标注）定位具体原因。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=no-build-log::编译未启动，无 build.log，请看上一步的 ::error:: 标注"
            mkdir -p out
            echo "编译未启动，无 build.log。" > out/build-tail.log
            exit 0
          fi
          {
            echo "## LibWrt 编译失败诊断"
            echo ""
            echo '**磁盘**'; echo '```'; df -h / /mnt 2>/dev/null | tail -4; echo '```'
            echo '**内存**'; echo '```'; free -h | head -3; echo '```'
            echo "### 错误行（末尾 40）"; echo '```'
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|fatal error|undefined reference|unable to select packages|breaks:|^Package .* is missing dependencies" "$LOG" 2>/dev/null | tail -40 || echo "(未匹配到关键字)"
            echo '```'
            echo "### 依赖冲突（若有）"; echo '```'
            grep -n -B2 -A40 "unable to select packages" "$LOG" 2>/dev/null | head -80 || echo "(无)"
            echo '```'
            echo "### 日志末尾 120 行"; echo '```'
            tail -120 "$LOG" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|undefined reference" "$LOG" 2>/dev/null \
            | tail -8 | while IFS= read -r l; do echo "::error title=build-error::$l"; done
          mkdir -p out
          tail -c 3000000 "$LOG" > out/build-tail.log 2>/dev/null || true

      - name: 上传编译日志（仅失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-build-log
          path: out/build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -name "*sysupgrade.bin" -exec cp {} out/ \;
          find openwrt/bin/targets -name "sha256sums" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "config.buildinfo" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "*.manifest" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- 产物清单 ---"
          ls -lh out/
          sha256sum out/* || true
          echo "--- 缓存与下载体积 ---"
          du -sh openwrt/.ccache openwrt/dl 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6-libwrt-firmware
          path: out/
          retention-days: 30

      # 失败也要留缓存：第 13 轮编了 4 小时死在最后的 package/install，而 actions/cache 的
      # post 步在 job 失败时被跳过（日志里 "Post 恢复 ccache ... skipped"）——等于每轮从冷
      # 缓存重来。拆成 restore + always() 的 save 两步。
      - name: 保存 ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /mnt/ax6build/openwrt/.ccache
          key: ccache-libwrt2512-${{ github.run_id }}

      - name: 保存 dl 缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /mnt/ax6build/openwrt/dl
          key: dl-libwrt-${{ hashFiles('libwrt/configs/libwrt-ax6.config') }}-${{ hashFiles('.github/workflows/build-libwrt.yml') }}
