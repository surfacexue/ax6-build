name: Build AX6 PPE-NSS Firmware

# 第三条线：ppe-nss(Linux 6.18) + Redmi AX6 单槽 stock 布局 + NSS FW 12.5
# 与主线的区别：
#   主线 build.yml      → qosmio 6.12.91 + ECM 加速（已验证 NSS/ECM/WireGuard）
#   本线 build-ppe.yml  → ppe-nss 6.18 + PPE/EDMA 有线 + NSS WiFi（无 ECM）
# 两线互斥：ECM 与 PPE 是两套数据面架构，不能同时装。
#
# 触发方式（2026-11-28 起）：
#   1. 手动 workflow_dispatch（可指定 ppe_sha / tiny_sha）
#   2. push 到 main，且改动命中 ppe/** 或本文件
# paths 只放 ppe/**，主线 build.yml 的 paths 也不含 ppe/**，两线互不误触发。
# concurrency 组按 ref 区分：push 与手动同为 refs/heads/main，串行且不互相取消。

on:
  workflow_dispatch:
    inputs:
      ppe_sha:
        description: 'ppe-nss 源码 commit（留空用默认 7d65a3e）'
        required: false
        default: '7d65a3ed836a0071e2f19a5944682f457e02efe0'
      tiny_sha:
        description: 'AX6-OpenWrt-Tiny 仓库 commit（提供 stock 移植脚本）'
        required: false
        default: '57e4ff319099af7683c2d0df1904b55a5a0c193e'
  push:
    branches: [main]
    paths:
      - 'ppe/**'
      - '.github/workflows/build-ppe.yml'

permissions:
  # write 是为了失败时能把日志 force-push 到 logs 分支。
  # 私有仓库的 job 日志/artifact 都要登录才能读，logs 分支是唯一免登录可取的通道。
  contents: write

concurrency:
  group: ax6-ppe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: PPE 6.18 / AX6 stock
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # push 触发时 inputs 为空串，必须 fallback 到钉住的 commit。
      # 否则 PPE_SOURCE_SHA 为空，下面 `git checkout "$PPE_SOURCE_SHA"` 与
      # `[[ HEAD == "$PPE_SOURCE_SHA" ]]` 必然失败。
      PPE_SOURCE_SHA: ${{ inputs.ppe_sha || '7d65a3ed836a0071e2f19a5944682f457e02efe0' }}
      TINY_SHA: ${{ inputs.tiny_sha || '57e4ff319099af7683c2d0df1904b55a5a0c193e' }}
      TZ: Asia/Shanghai

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          echo "run=${{ github.run_id }} ref=${{ github.ref }}"
          echo "ppe=$PPE_SOURCE_SHA tiny=$TINY_SHA"
          df -h /; free -h; nproc

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev file wget swig time curl \
            xz-utils zstd subversion libelf-dev ca-certificates squashfs-tools
          sudo apt-get clean

      - name: 拉取 AX6-OpenWrt-Tiny（stock 移植脚本来源）
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Steven-ZYC/AX6-OpenWrt-Tiny.git tiny-repo
          git -C tiny-repo fetch --depth=1 origin "$TINY_SHA"
          git -C tiny-repo checkout --detach "$TINY_SHA"
          [[ "$(git -C tiny-repo rev-parse HEAD)" == "$TINY_SHA" ]]
          echo "TINY_REPO=$PWD/tiny-repo" >> "$GITHUB_ENV"
          ls tiny-repo/scripts/ | head -20

      - name: 拉取 ppe-nss 源码（钉 commit）
        run: |
          git clone --depth 1 --single-branch --branch ppe-nss \
            https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git ppe-source
          if [[ "$(git -C ppe-source rev-parse HEAD)" != "$PPE_SOURCE_SHA" ]]; then
            git -C ppe-source fetch --depth=1 origin "$PPE_SOURCE_SHA"
            git -C ppe-source checkout --detach "$PPE_SOURCE_SHA"
          fi
          [[ "$(git -C ppe-source rev-parse HEAD)" == "$PPE_SOURCE_SHA" ]]
          git -C ppe-source log -1 --format='ppe-nss: %h %ci %s'
          grep -Fqx 'KERNEL_PATCHVER:=6.18' ppe-source/target/linux/qualcommax/Makefile \
            || { echo "::error::ppe-nss 内核已不是 6.18，脚本锚点需复核"; exit 1; }

      - name: 恢复 ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ppe-source/.ccache
          key: ccache-ppe2618-${{ github.run_id }}
          restore-keys: |
            ccache-ppe2618-

      - name: 恢复 dl 缓存
        id: dl-restore
        uses: actions/cache/restore@v4
        with:
          path: ppe-source/dl
          key: dl-ppe2618-${{ hashFiles('ppe/configs/ax6-ppe-nss.config') }}
          restore-keys: |
            dl-ppe2618-

      - name: 源准备（stock 移植 + nss feed + argon + 单槽容错）
        working-directory: ppe-source
        run: |
          mkdir -p .ccache
          printf 'ccache_dir=%s\nmax_size=4G\ncompression=false\n' "$PWD/.ccache" > /tmp/ccache.conf
          export CCACHE_CONFIGPATH=/tmp/ccache.conf
          bash ../ppe/scripts/prepare.sh

      - name: 应用编译配置
        working-directory: ppe-source
        run: |
          cp ../ppe/configs/ax6-ppe-nss.config .config
          make defconfig
          cp .config ../build.config
          echo "--- 设备选择 ---"
          grep -E '^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_' .config

      - name: 校验核心功能包（缺失即中止）
        working-directory: ppe-source
        run: |
          set -e
          fail=0
          # 必装包清单的唯一真源：ppe/scripts/required-packages.txt
          # 本步查 .config（包被“选中”，1–2 分钟就失败）；同一份清单在「校验并归集产物」里
          # 还会再查一次 manifest（包真“进了镜像”）。加包只改那一份文件，别在本文件再抄一份。
          # 本步不区分 hard/soft：此刻还没编译，缺任何一条都该立刻停，早失败零浪费。
          LIST=../ppe/scripts/required-packages.txt
          [[ -f "$LIST" ]] || { echo "::error::缺少必装包清单 $LIST"; exit 1; }
          # 条数由清单自己声明（#expect=N），清单缩短时只改数据，不改 workflow。
          expect=$(grep -m1 -o '^#expect=[0-9][0-9]*' "$LIST" | cut -d= -f2)
          [[ -n "$expect" ]] || { echo "::error::清单缺 #expect=N 行，无法核对条数"; exit 1; }
          total=0
          while IFS=$'\t' read -r pkg grade desc; do
            case "$pkg" in ''|'#'*) continue ;; esac
            total=$((total+1))
            case "$grade" in
              hard|soft) ;;
              *) echo "::error::清单级别非法（只许 hard/soft）：$pkg => '${grade}'"; fail=1; continue ;;
            esac
            if grep -qxF "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "OK   $pkg"
            else
              echo "::error::缺少 $pkg（$desc）"; fail=1
            fi
          done < <(tr -d '\r' < "$LIST")
          echo "--- 清单共 $total 项 / 声明 $expect 项（.config 侧已校验）---"
          [[ "$total" == "$expect" ]] || { echo "::error::清单条数 $total 与声明 $expect 不符（增删条目要同步改 #expect=）"; fail=1; }
          [[ $total -ge 30 ]] || { echo "::error::清单只读到 $total 项，疑似被截断或格式错误"; fail=1; }

          echo "--- ttyd 依赖校验：必须是 libwebsockets-full（带 LIBUV）---"
          # ttyd 1.7.7 的 CMakeLists.txt:64 硬性要求 LWS_WITH_LIBUV，只有 full 变体编了这个。
          # 换成 libwebsockets-openssl 会直接 FATAL_ERROR（run 46110723733 实测）。
          if grep -qx 'CONFIG_PACKAGE_libwebsockets-full=y' .config; then
            echo "OK   libwebsockets-full 已启用（含 LWS_WITH_LIBUV）"
          else
            echo "::error::libwebsockets-full 未启用 —— ttyd 会因缺 LWS_WITH_LIBUV 编译失败"; fail=1
          fi
          if grep -qx 'CONFIG_PACKAGE_libwebsockets-openssl=y' .config; then
            echo "::error::libwebsockets-openssl 与 full 冲突且无 libuv，ttyd 编不过"; fail=1
          fi

          echo "--- libwebsockets 版本校验：必须 4.3.3 ---"
          # lws master 的 5.1.0 改了 external event loop，与 ttyd 的 uvwasi 主循环不兼容：
          # 设备实测起动 9ms 后 lws_context_destroy、exit_code 0、procd 无限重启。
          # prepare.sh 用 ppe/pkgs/libwebsockets/Makefile 覆盖成 24.10 的 4.3.3。
          LWS_MK=feeds/packages/libs/libwebsockets/Makefile
          if [[ ! -f "$LWS_MK" ]]; then
            echo "::error::找不到 $LWS_MK（feeds 布局变了，断言失效）—— libs 下实际内容："
            ls -l feeds/packages/libs | head -20
            fail=1
          elif ! grep -q '^PKG_VERSION:=4\.3\.3' "$LWS_MK"; then
            echo "::error::libwebsockets 不是 4.3.3（实际 $(grep -m1 '^PKG_VERSION:=' "$LWS_MK")），prepare.sh 的钉版未生效，ttyd 会启动即崩"; fail=1
          else
            echo "OK   libwebsockets 4.3.3"
          fi

          echo "--- 互斥项：dnsmasq 三个变体抢同一组文件 ---"
          for bad in CONFIG_PACKAGE_dnsmasq=y CONFIG_PACKAGE_dnsmasq-dhcpv6=y; do
            if grep -qx "$bad" .config; then
              echo "::error::$bad 与 dnsmasq-full 提供同一组文件，会撞 package/install"; fail=1
            else
              echo "OK   $bad 为 not set"
            fi
          done

          echo "--- 必须存在的架构开关 ---"
          for kv in 'CONFIG_NSS_FIRMWARE_VERSION_12_5=y' \
                    'CONFIG_ATH11K_NSS_WIFI=y'; do
            grep -qx "$kv" .config && echo "OK   $kv" || { echo "::error::缺少 $kv"; fail=1; }
          done

          echo "--- 必须不存在的旧栈 / 完整内核 ---"
          for kv in 'CONFIG_PACKAGE_qca-nss-ecm' 'CONFIG_PACKAGE_kmod-shortcut-fe' 'CONFIG_PACKAGE_sing-box'; do
            if grep -qx "$kv=y" .config; then
              echo "::error::$kv 不应启用（PPE 架构下互斥）"; fail=1
            else
              echo "OK   $kv 未启用"
            fi
          done

          [[ $fail -eq 0 ]] || exit 1

      - name: 下载依赖源码
        working-directory: ppe-source
        run: |
          make download -j8 || make download -j1 V=s
          find dl -type f -size -1024c -print 2>/dev/null || true
          df -h /

      - name: 预编 FullCone 链路（早失败 / 自动降级）
        working-directory: ppe-source
        run: |
          set -o pipefail
          LOG=/tmp/prebuild-fullcone.log
          drop_fullcone() {
            echo "::warning::$1 —— 本次构建剔除 FullCone，其余功能照常编译"
            sed -i -e 's|^CONFIG_PACKAGE_kmod-nft-fullcone=y|# CONFIG_PACKAGE_kmod-nft-fullcone is not set|' \
                   -e 's|^CONFIG_PACKAGE_luci-app-fullcone=y|# CONFIG_PACKAGE_luci-app-fullcone is not set|' .config
            make defconfig
            cp .config ../build.config
            if grep -qx 'CONFIG_PACKAGE_kmod-nft-fullcone=y' .config; then
              echo "::error::剔除 FullCone 失败，配置里仍然启用"; exit 1
            fi
            echo "FULLCONE=dropped" >> "$GITHUB_ENV"
          }
          # 第一层：静态自检。这一步不依赖工具链，任何时候都能做，也一定能给出结论。
          #   - 三份补丁必须随仓库到齐（prepare.sh 拷进各包的 patches/）
          #   - 补丁里必须真的带 fullcone 表达式/符号（拷错了包也算不过）
          #   - firewall4 的 Makefile 必须声明 kmod 依赖
          for p in package/libs/libnftnl/patches/900-fullcone.patch \
                   package/network/utils/nftables/patches/900-fullcone.patch \
                   package/network/config/firewall4/patches/900-fullcone.patch; do
            [ -s "$p" ] || drop_fullcone "补丁文件缺失或为空：$p"
          done
          grep -q 'expr/fullcone' package/libs/libnftnl/patches/900-fullcone.patch \
            || drop_fullcone "libnftnl 补丁里没有 fullcone 表达式源文件"
          grep -q 'fullcone' package/network/utils/nftables/patches/900-fullcone.patch \
            || drop_fullcone "nftables 补丁里没有 fullcone 语法"
          grep -q 'kmod-nft-fullcone' package/network/config/firewall4/Makefile \
            || drop_fullcone "firewall4 的 Makefile 没声明 kmod-nft-fullcone 依赖"
          echo "OK: FullCone 三份补丁到位，符号与依赖齐全"

          # 第二层：试编译。FullCone 要四件套一起编——libnftnl（表达式库）、nftables（语法）、
          # firewall4（fw4 开关）、内核模块；真正的不兼容只有编过才知道。
          # 但 package/.../compile 依赖已建好的工具链与 staging_dir：全新 job 跑到这里时
          # 它们还不存在，make 会立刻失败（run #2 就是这样，1.2 秒失败、还被误报成
          # "FullCone 预编失败"）。所以先看有没有工具链，没有就明说跳过。
          if ! ls -d staging_dir/toolchain-* >/dev/null 2>&1; then
            echo "::notice::工具链尚未构建，跳过试编译；四件套由正式编译验证（静态自检已通过）"
            echo "FULLCONE=kept" >> "$GITHUB_ENV"
            exit 0
          fi

          if make -j"$(nproc)" V=s \
                 package/libs/libnftnl/compile \
                 package/network/utils/nftables/compile \
                 package/network/config/firewall4/compile \
                 package/ax6-pkgs/fullconenat-nft/compile 2>&1 | tee "$LOG"; then
            echo "OK: FullCone 链路（libnftnl / nftables / firewall4 / kmod）预编通过"
            echo "FULLCONE=kept" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "--- 预编失败，日志末尾 ---"
          tail -40 "$LOG" || true
          if grep -qE 'nft_ext_fullcone\.c:[0-9]+:[0-9]+: (error|fatal error)|nf_nat_fullcone\.c:[0-9]+:[0-9]+: (error|fatal error)|Hunk #[0-9]+ FAILED|patch does not apply' "$LOG"; then
            drop_fullcone "确认 FullCone 源码或补丁与本树不兼容"
          else
            echo "::warning::预编失败但报错不在 FullCone 自身（见上面日志），保持原配置，由正式编译判定"
            echo "FULLCONE=kept" >> "$GITHUB_ENV"
          fi

      - name: 编译固件
        working-directory: ppe-source
        run: |
          # 必须开 pipefail：`make ... | tee` 的退出码是 tee 的，make 失败会被吞成 success，
          # 然后一路走到"产物归集"才以 glob=0 的形式暴露，且失败诊断/日志上传因 success 被跳过。
          set -o pipefail
          export CCACHE_CONFIGPATH=/tmp/ccache.conf

          # ---- 早失败：单独先编 libwebsockets ----
          # lws 三次失败全在它自己身上（Makefile 缩进、CMake 版本断言、钉版失效），
          # 而它排在包阶段靠后位置，一失败就要等满 60 分钟。先单独编它：
          # 依赖（toolchain/openssl/libuv）在这一步一并构建，随后完整 make 直接复用，
          # 总时长基本不变，但 lws 出问题能在半小时内暴露。
          echo "===== 预编 libwebsockets（早失败）====="
          pre=0
          # 日志必须写到 /tmp/build.log：失败诊断、上传日志、logs 分支三处都只认这个文件名。
          # run 46127565116 就是在这丢了日志 —— 预编写 /tmp/build-lws.log，诊断读 build.log，
          # 结果失败后只有 16 行"没有日志"的摘要，真实错误一个字都没留下。
          make package/feeds/packages/libwebsockets/compile -j1 V=s 2>&1 | tee /tmp/build.log || pre=$?
          cp /tmp/build.log /tmp/build-lws.log || true
          if [[ $pre -ne 0 ]]; then
            echo "::error::libwebsockets 预编失败（configure/编译阶段），本轮在完整编译前中止；完整日志见 /tmp/build.log"
            exit $pre
          fi
          echo "===== 预编通过，开始完整编译 ====="

          echo "===== 第 1 轮：并行编译 ====="
          rc=0
          make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log || rc=$?

          if [[ $rc -ne 0 ]]; then
            # 移植自主线 build.yml 的成熟做法：OpenWrt 在 -j 高并发下的 race
            # （临时文件抢写、host tool 并发）是很常见的假失败，-j1 重试往往直接过。
            # 多花几分钟，换掉一整轮 70 分钟的损失，很值。
            echo "::warning::并行编译失败（rc=$rc），改用单线程重试"
            cp /tmp/build.log /tmp/build_parallel.log
            set +e
            timeout 45m make -j1 V=s 2>&1 | tee /tmp/build_serial.log
            rc2=$?
            set -e
            # 串行日志接在并行日志后面，便于诊断看到完整过程
            { echo; echo "===== 以下为 -j1 串行重试 ====="; cat /tmp/build_serial.log; } > /tmp/build.log
            if [[ $rc2 -ne 0 ]]; then
              echo "::error::并行与串行两轮都失败（rc=$rc / $rc2），是真实错误"
              rc=$rc2
            else
              echo "OK: 串行重试通过 —— 首轮属于并行 race，非真实错误"
              rc=0
            fi
          fi
          exit $rc

      - name: 失败诊断
        if: failure() || cancelled()
        run: |
          LOG=""
          for f in /tmp/build.log /tmp/build-lws.log /tmp/build_serial.log; do
            [[ -s "$f" ]] && { LOG=$f; break; }
          done
          [[ -n "$LOG" ]] || { echo "(无构建日志：/tmp/build.log、build-lws.log、build_serial.log 都不存在)"; exit 0; }
          echo "诊断读取：$LOG"
          echo "===== 日志规模 ====="; wc -l "$LOG" || true

          echo "===== 日志尾部 60 行 ====="
          tail -60 "$LOG" || true

          # 定位第一个"真实"错误。
          # 上一版只做 tail -15，结果全是 `make[1]: *** [package/Makefile:251: .package_compile] Error 2`
          # 这类顶层汇总行，看完等于没看。这里排除掉 (ignored) 与顶层汇总，取第一处。
          first=$(grep -nE '(^|[^A-Za-z])(Error|error) [1-9][0-9]*($|[^0-9])' "$LOG" \
                    | grep -v '(ignored)' \
                    | grep -vE 'package/Makefile:[0-9]+: .*\.package_compile' \
                    | grep -v 'toplevel\.mk' \
                    | head -1 | cut -d: -f1)
          echo "===== 第一个真实错误在第 ${first:-未找到} 行 ====="
          : > /tmp/ctx.txt
          if [[ -n "$first" ]]; then
            start=$(( first > 60 ? first - 60 : 1 ))
            end=$(( first + 20 ))
            sed -n "${start},${end}p" "$LOG" >> /tmp/ctx.txt
          fi

          echo "===== 所有 Error 行（一次看全）====="
          grep -nE 'make(\[[0-9]+\])?: \*\*\* \[[^]]+\] Error' "$LOG" | tail -30 || true

          # 关键行塞进 annotation：私有仓库的 job 日志要登录才能看，
          # 但 annotations 通过 API 免登录可读，出问题时不必人工贴日志。
          esc() { sed 's/%/%25/g; s/\r//g' | tr '\n' '%0A'; }
          if [[ -s /tmp/ctx.txt ]]; then
            echo "===== 错误上下文 ====="
            cat /tmp/ctx.txt
            echo "::error::编译失败上下文（第 ${first} 行附近，完整日志见 artifact ppe-build-log-${GITHUB_RUN_ID}）：%0A$(esc < /tmp/ctx.txt)"
          else
            tail -150 "$LOG" | esc > /tmp/t.txt
            echo "::error::编译失败，未匹配到具体错误行，以下为日志尾部：%0A$(cat /tmp/t.txt)"
          fi

      - name: 上传编译日志（仅失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ppe-build-log-${{ github.run_id }}
          path: |
            /tmp/build.log
            /tmp/build-lws.log
            /tmp/build_serial.log
          if-no-files-found: ignore
          retention-days: 7

      # 移植自主线 build.yml 的成熟机制（那边踩过"最需要日志时恰好拿不到"的坑）。
      # artifact 与 job 日志都要登录才能下载，logs 分支 force-push 后本地 fetch 即可读，
      # 不必再靠人工贴日志，也不必为了看错误再等一轮 77 分钟。
      - name: 发布失败日志到 logs 分支
        if: failure() || cancelled()
        run: |
          set +e
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/build-lws.log
          [ -s "$LOG" ] || LOG=/tmp/build_serial.log
          R=/tmp/failure-report.txt
          {
            echo "run_id  : ${{ github.run_id }}"
            echo "commit  : ${{ github.sha }}"
            echo "url     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time    : $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "logline : $(wc -l < "$LOG" 2>/dev/null || echo '?')"
            echo
            echo "########## 第一个真实错误（上下文 60 行） ##########"
            first=$(grep -nE '(^|[^A-Za-z])(Error|error) [1-9][0-9]*($|[^0-9])' "$LOG" 2>/dev/null \
                      | grep -v '(ignored)' \
                      | grep -vE 'package/Makefile:[0-9]+: .*\.package_compile' \
                      | grep -v 'toplevel\.mk' | head -1 | cut -d: -f1)
            if [ -n "$first" ]; then
              s=$(( first > 60 ? first - 60 : 1 ))
              sed -n "${s},$(( first + 25 ))p" "$LOG"
            else
              echo "(未定位到具体错误行)"
            fi
            echo
            echo "########## 失败目标（make *** Error） ##########"
            grep -nE 'make(\[[0-9]+\])?: \*\*\* \[[^]]+\] Error' "$LOG" 2>/dev/null | tail -40
            echo
            echo "########## 关键字（末尾 100） ##########"
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|undefined reference|missing dependencies|Conflicts|unable to select packages|breaks:" "$LOG" 2>/dev/null | tail -100
            echo
            echo "########## 日志末尾 800 行 ##########"
            tail -800 "$LOG"
          } > "$R" 2>&1
          echo "报告大小: $(wc -c < "$R") 字节"

          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git symbolic-ref HEAD refs/heads/logs
          git config user.email "ci@ax6build.local"
          git config user.name "ax6build-ci"
          cp "$R" "ppe-failure-${GITHUB_RUN_ID}.txt"
          git add -A
          git commit -q -m "PPE failure log run $GITHUB_RUN_ID ($GITHUB_SHA)" || true
          if git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs; then
            echo "OK: 已发布到 logs 分支 → ppe-failure-${GITHUB_RUN_ID}.txt"
          else
            echo "::warning::发布 logs 分支失败（不影响主流程）"
          fi

      - name: 校验并归集产物
        working-directory: ppe-source
        run: |
          TARGET=bin/targets/qualcommax/ipq807x
          shopt -s nullglob
          factories=("$TARGET"/*redmi_ax6-stock*squashfs-factory.ubi)
          upgrades=("$TARGET"/*redmi_ax6-stock*squashfs-sysupgrade.bin)
          manifests=("$TARGET"/*redmi_ax6-stock*.manifest)
          counts="factory=${#factories[@]} sysupgrade=${#upgrades[@]} manifest=${#manifests[@]}"
          echo "$counts"
          if (( ${#factories[@]} != 1 || ${#upgrades[@]} != 1 || ${#manifests[@]} != 1 )); then
            ls -la "$TARGET" | head -40
            detail=$(ls -la "$TARGET" | head -40 | sed 's/%/%25/g; s/\r//g' | tr '\n' '%0A')
            echo "::error::产物不唯一（${counts}）%0A${detail}"
            exit 1
          fi

          mkdir -p ../out
          echo "--- manifest 末态校验：清单里的包必须真进了镜像 ---"
          # manifest 的行是 `<name> - <version>`（实测 237 行，如 `ttyd - 1.7.7-r1`），
          # 所以整行精确匹配（grep -qx）永远不中；带 ABI 的库在 manifest 里还带数字后缀
          # （实测 libwebsockets-full -> libwebsockets-full23），故按「包名 + 纯数字后缀」容错。
          # 分级：hard 缺包 → 判失败，产物不落地；soft 缺包 → 只告警，照常上传，缺失写进 out/MISSING-SOFT.txt。
          LIST=../ppe/scripts/required-packages.txt
          expect=$(grep -m1 -o '^#expect=[0-9][0-9]*' "$LIST" | cut -d= -f2)
          forbid=$(grep -m1 -o '^#forbid=[^[:space:]]*' "$LIST" | cut -d= -f2)
          total=0; hard_missing=0; soft_missing=0; soft_lines=""
          dups=$(tr -d '\r' < "$LIST" | grep -v '^#' | cut -f1 | grep -v '^$' | sort | uniq -d | tr '\n' ' ')
          if [[ -n "$dups" ]]; then
            echo "::error::清单里有重复条目：$dups"; hard_missing=1
          fi
          while IFS=$'\t' read -r pkg grade desc; do
            case "$pkg" in ''|'#'*) continue ;; esac
            total=$((total+1))
            case "$grade" in
              hard|soft) ;;
              *) echo "::error::清单级别非法（只许 hard/soft）：$pkg => '${grade}'"; hard_missing=1; continue ;;
            esac
            if awk -v p="$pkg" '{ s = substr($1, length(p) + 1); if ($1 == p || (index($1, p) == 1 && s ~ /^[0-9]+$/)) f = 1 } END { exit(f ? 0 : 1) }' "${manifests[0]}"; then
              continue
            fi
            if [[ "$grade" == hard ]]; then
              echo "::error::manifest 里没有硬依赖 $pkg（$desc）"; hard_missing=1
            else
              echo "::warning::manifest 里没有 $pkg（$desc），不阻断上传"; soft_missing=$((soft_missing+1))
              soft_lines="${soft_lines}${pkg}	${desc}"$'\n'
            fi
          done < <(tr -d '\r' < "$LIST")
          if (( total < 30 )); then
            echo "::error::清单只读到 $total 项，疑似被截断或格式错误"; exit 1
          fi
          if [[ -n "$expect" && "$total" != "$expect" ]]; then
            echo "::error::清单条数 $total 与声明 $expect 不符"; hard_missing=1
          fi
          # 末态还要断言「没装错变体」：.config 里选的对，镜像里仍可能装成别的变体，
          # run 46110723733 就是 libwebsockets-openssl 混进来把 ttyd 编死。
          for bad in ${forbid//,/ }; do
            if awk -v p="$bad" '{ s = substr($1, length(p) + 1); if ($1 == p || (index($1, p) == 1 && s ~ /^[0-9]+$/)) f = 1 } END { exit(f ? 0 : 1) }' "${manifests[0]}"; then
              echo "::error::manifest 里出现了禁止的变体 $bad"; hard_missing=1
            fi
          done
          if (( soft_missing )); then
            printf '%s' "$soft_lines" > ../out/MISSING-SOFT.txt
            echo "::warning::manifest 缺 soft 依赖 $soft_missing 项，明细见 out/MISSING-SOFT.txt，不阻断上传"
            echo "小计：$total 项 = hard 全在 + soft 缺 $soft_missing"
          elif (( hard_missing == 0 )); then
            echo "OK   清单 $total 项在 manifest 里全部命中（hard 与 soft 都在）"
          fi
          if (( hard_missing )); then
            echo "--- manifest 实际内容（前 40 行）---"
            head -40 "${manifests[0]}"
            exit 1
          fi
          python3 ../ppe/scripts/check-stock-image.py "${upgrades[0]}" "${factories[0]}" \
            | tee ../out/IMAGE-AUDIT.md
          cp "${factories[0]}" ../out/AX6-ppe-nss-factory.ubi
          cp "${upgrades[0]}"  ../out/AX6-ppe-nss-sysupgrade.bin
          cp "${manifests[0]}" ../out/AX6-ppe-nss.manifest
          cp .config ../out/build.config
          cp ../ppe/scripts/required-packages.txt ../out/required-packages.txt
          cp ../out/IMAGE-AUDIT.md ../out/AX6-ppe-nss-IMAGE-AUDIT.md
          echo 'EXPERIMENTAL - 未在真机验证 PPE/NSS 转发、WiFi、boot 与回滚。' > ../out/UNVERIFIED.txt
          case "${FULLCONE:-kept}" in
            dropped) echo 'FullCone: 已剔除（fullconenat-nft 源码与 6.18 内核不兼容，见运行日志）' >> ../out/UNVERIFIED.txt ;;
            *)       echo 'FullCone: 含 kmod-nft-fullcone + nftables/firewall4 补丁 + LuCI 页（默认关闭，需在 LuCI 或 uci 里开启）' >> ../out/UNVERIFIED.txt ;;
          esac
          echo 'Proxy: HomeProxy + sing-box-tiny（去 QUIC/gVisor），未做真机连通性验证' >> ../out/UNVERIFIED.txt
          ( cd ../out && sha256sum *.ubi *.bin > SHA256SUMS )
          echo "--- 体积 ---"
          ls -lh ../out/

      - name: 保存 ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ppe-source/.ccache
          key: ccache-ppe2618-${{ github.run_id }}

      - name: 保存 dl 缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ppe-source/dl
          key: dl-ppe2618-${{ hashFiles('ppe/configs/ax6-ppe-nss.config') }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6-ppe-nss-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30
