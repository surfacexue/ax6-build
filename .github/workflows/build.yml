name: Build AX6 NSS Firmware
# trigger-marker: 3

# 云编译 qosmio/openwrt-ipq 的 25.12-nss 分支，产出 Redmi AX6（原厂 stock 分区布局）固件。
#
# 相对上游（qosmio/openwrt-ipq）的四处改动，全部在本仓库内可见、可回滚：
#   1. patches/0001-add-redmi-ax6-stock.patch
#      上游只有 redmi_ax6（扩容布局），补上 redmi_ax6-stock（原厂布局）。
#   2. 并入 TerryLip/AX6NSS-qosmio 的 package/new + package/emortal
#      第三方 app：argon 主题、openclash、mosdns、turboacc、vlmcsd、cpufreq、autocore、coremark、default-settings。
#   3. luci feed 指向 immortalwrt 的 openwrt-25.12（与 ax6.config 里的 LuCI 选择同源）。
#   4. ax6.config 启用 WireGuard 四包、tailscale（含 kmod-tun）、luci-ssl-openssl、
#      kmod-nf-nathelper 与 -extra。
#      （热控 CONFIG_THERMAL=y 本来就在 target/linux/qualcommax/config-6.12，
#        不需要 kmod-thermal 包，也无此包。）
#
# 用法：仓库 Actions 页 -> Build AX6 NSS Firmware -> Run workflow

on:
  push:
    branches: [main]
    paths:
      - 'ax6.config'
      - '.github/workflows/build.yml'
      - 'patches/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'qosmio/openwrt-ipq 的分支/标签'
        required: false
        default: '25.12-nss'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 350
    env:
      SOURCE_REPO: qosmio/openwrt-ipq
      SOURCE_REF: ${{ github.event.inputs.source_ref || '25.12-nss' }}
      # 第三方包来源（TerryLip 树内 package/new、package/emortal）
      EXTRAPKG_REPO: TerryLip/AX6NSS-qosmio
      EXTRAPKG_REF: qualcommax-6.x-nss-wifi
      # ccache 放到 74G 临时盘，避免挤占根分区。
      # 关键：OpenWrt 的 rules.mk 第 355 行会强制
      #   export CCACHE_DIR := $(if $(CONFIG_CCACHE_DIR), $(CONFIG_CCACHE_DIR), $(TOPDIR)/.ccache)
      # 而 ax6.config 里 CONFIG_CCACHE_DIR=""，TOPDIR 就是 /mnt/ax6build/openwrt，
      # 所以 ccache 实际写在 /mnt/ax6build/openwrt/.ccache。job 级的 env 会被 make 覆盖，
      # 因此下面的 env 与 actions/cache 的 path 都必须指向这个真实目录，否则缓存每轮白传。
      CCACHE_DIR: /mnt/ax6build/openwrt/.ccache

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          uname -a
          echo "CPU 核心: $(nproc)"
          free -h
          df -h /

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/microsoft \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo apt-get -y purge -qq '^llvm-.*' '^mysql-.*' '^php.*' 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget subversion ccache time
          df -h /

      - name: 拉取固件源码
        run: |
          # runner 根分区只有 ~14G（清理后约 30G），qualcommax + NSS 全量编译
          # 加上 ccache 很容易顶满；另有一块 74G 临时盘挂在 /mnt，把构建树放过去。
          BUILD_ROOT=/mnt/ax6build
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_ROOT"
          echo "--- 磁盘 ---"
          df -h / /mnt
          echo "源码: $SOURCE_REPO  分支: $SOURCE_REF"
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://github.com/$SOURCE_REPO.git" "$BUILD_ROOT/openwrt"
          ln -sfn "$BUILD_ROOT/openwrt" openwrt
          cd openwrt
          echo "--- 源码 HEAD ---"
          git log -1 --oneline
          echo "--- 内核版本 ---"
          cat target/linux/generic/kernel-6.12 2>/dev/null | head -2
          echo "--- mac80211 backports 版本 ---"
          sed -n 's/^PKG_VERSION:=//p' package/kernel/mac80211/Makefile | head -1
          du -sh .

      - name: 恢复 ccache
        uses: actions/cache/restore@v4
        with:
          # 与 rules.mk 里 CCACHE_DIR 的落盘位置一致（$(TOPDIR)/.ccache）
          path: /mnt/ax6build/openwrt/.ccache
          key: ccache-qosmio2512-${{ github.run_id }}
          restore-keys: |
            ccache-qosmio2512-

      - name: 更新 feeds（luci 指向 immortalwrt openwrt-25.12）
        run: |
          # 先把 ccache 容量钉住：本树 rules.mk 强制 CCACHE_NOCOMPRESS=true（缓存不压缩），
          # 不设上限会一路涨到默认值，与 74G 构建树抢空间。放在恢复后执行，避免被缓存里的
          # 旧 ccache.conf 覆盖。这里不新增步骤，保持下文「第 N 步」的编号不变。
          mkdir -p /mnt/ax6build/openwrt/.ccache
          ccache --max-size=4G
          echo "--- ccache 配置 ---"
          (ccache --show-config 2>/dev/null || ccache -p) | grep -iE 'max_size|compress' || true
          cd openwrt
          # 【为什么单独换 luci】
          # qosmio 25.12-nss 的 feeds 全部锁在 openwrt-25.12，本身是自洽的；
          # 但 ax6.config 里的 LuCI 选择（argon 主题、argon-config、openclash、
          # vlmcsd、turboacc 等）来自 immortalwrt 的 LuCI 分支，官方 LuCI 里没有
          # argon 主题。为了让编译出的界面与当前在跑的固件一致，只把 luci 换成
          # immortalwrt；packages/routing/telephony/video 保持 openwrt-25.12。
          # immortalwrt 的 luci.mk 无 LUCI_UT_MIN_UCODE 约束，不会把模板编成
          # ucode 字节码（那是我们之前踩过的坑）。
          if [ -f feeds.conf ]; then rm -f feeds.conf; fi
          sed -i 's#^src-git luci .*#src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12#' feeds.conf.default
          echo "--- feeds.conf.default ---"
          grep -E '^src-git' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 并入第三方包并应用 AX6 stock 补丁
        run: |
          set -e
          cd openwrt

          # 1) 第三方包：argon/openclash/mosdns/turboacc/vlmcsd/cpufreq/autocore/coremark/default-settings
          #    这些包 upstream(qosmio) 没有，TerryLip 树里是以树内 package 的形式维护的，
          #    这里整目录并入，不占用本仓库体积。
          git clone --depth 1 --branch "$EXTRAPKG_REF" \
            "https://github.com/$EXTRAPKG_REPO.git" /tmp/extrapkg
          mkdir -p package/new package/emortal
          cp -a /tmp/extrapkg/package/new/. package/new/
          cp -a /tmp/extrapkg/package/emortal/. package/emortal/
          echo "--- 并入的目录 ---"
          ls package/new package/emortal

          # 1a) vlmcsd 的 PKG_MIRROR_HASH 写死的是 2020 年那份 tarball 的 sha256。
          #     它带 debian/docker 两个 submodule，dl_github_archive.py 不支持 submodule，
          #     fallback 用 git clone+archive 重新打包，内容必然与当年不同 →
          #     download.pl 校验 hash 不过就删档重试，最终 Error 1（run #12 即死于此）。
          #     源码版本仍钉死在 e599080，submodule 只是打包辅助目录、不参与产物，
          #     所以把镜像校验改成 skip（该值是 OpenWrt 下载脚本支持的）。
          sed -i 's|^PKG_MIRROR_HASH:=.*|PKG_MIRROR_HASH:=skip|' package/new/vlmcsd/Makefile
          grep -E '^PKG_(SOURCE_VERSION|MIRROR_HASH)' package/new/vlmcsd/Makefile

          # 1b) mosdns 的 LuCI 界面不在这两者里，它由第三方 sbwml 维护
          #     （immortalwrt 的 luci 与 packages 都只带 mosdns 本体，没有界面）。
          #     只取 luci-app-mosdns 与它依赖的 geo2txt，mosdns 本体仍用 feed 的版本。
          git clone --depth 1 --branch v5 \
            https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns
          cp -a /tmp/mosdns/luci-app-mosdns package/
          cp -a /tmp/mosdns/geo2txt package/
          echo "--- mosdns 界面 ---"
          sed -n 's/^PKG_VERSION:=//p' package/luci-app-mosdns/Makefile
          grep -E '^LUCI_DEPENDS' package/luci-app-mosdns/Makefile

          # 2) 设备定义：补 redmi_ax6-stock（原厂分区布局）
          PATCH="$GITHUB_WORKSPACE/patches/0001-add-redmi-ax6-stock.patch"
          git apply --check -v "$PATCH"
          git apply "$PATCH"
          echo "--- 补丁结果 ---"
          grep -A9 'define Device/redmi_ax6-stock' target/linux/qualcommax/image/ipq807x.mk

      - name: 校验工具链与 LuCI 来源
        run: |
          set -e
          cd openwrt

          # LuCI 必须来自 immortalwrt，且不得含 ucode 字节码约束
          test -f feeds/luci/luci.mk || { echo "::error::feeds/luci/luci.mk 缺失"; exit 1; }
          if grep -q 'LUCI_UT_MIN_UCODE' feeds/luci/luci.mk; then
            echo "::error::luci.mk 含 LUCI_UT_MIN_UCODE，会强制 ucode 字节码，与本树 ucode 冲突"
            exit 1
          fi
          echo "OK  luci.mk 无 ucode 字节码约束"
          grep -E '^LUCI_BRANCH|^LUCI_RELEASE' feeds/luci/luci.mk | head -3 || true
          git -C feeds/luci log -1 --format='LuCI 提交: %h %ad %s' --date=short 2>/dev/null || true

          # 【必须修的一行】immortalwrt 的 luci-ssl-openssl 还依赖 px5g-openssl，
          # 而 openwrt-25.12 已经把 px5g 拆成 px5g-mbedtls / px5g-wolfssl，
          # px5g-openssl 在官方树和 immortalwrt packages 里都不存在（三方均 404）。
          # 官方 luci openwrt-25.12 的同一文件写的是 +openssl-util，且包描述文本
          # 本身就说「用 openssl 命令行工具生成证书，而不是默认的 px5g」。
          # 因此这里改回 +openssl-util，与官方 25.12 对齐。
          SSL_MK=feeds/luci/collections/luci-ssl-openssl/Makefile
          test -f "$SSL_MK" || { echo "::error::找不到 $SSL_MK"; exit 1; }
          if grep -q '+px5g-openssl' "$SSL_MK"; then
            sed -i 's#+px5g-openssl#+openssl-util#' "$SSL_MK"
            echo "已修正：+px5g-openssl -> +openssl-util（px5g-openssl 在 25.12 已移除）"
          fi
          grep -nE '^\s*\+(libustream|openssl|px5g)' "$SSL_MK" || true
          if grep -q 'px5g-openssl' "$SSL_MK"; then
            echo "::error::luci-ssl-openssl 仍然依赖不存在的 px5g-openssl"; exit 1
          fi

          # argon 主题必须在（界面与当前系统一致的前提）
          if [ -d feeds/luci/themes/luci-theme-argon ] || [ -d package/new/luci-theme-argon ]; then
            echo "OK  argon 主题存在"
          else
            echo "::error::argon 主题缺失，LuCI 界面会与当前系统不一致"
            exit 1
          fi

          # tailscale 需要 Go >= 1.27（其 go.mod 声明 go 1.27.3，且使用 Go 1.24 的 tool 块）
          # openwrt-25.12 的 packages feed 自带 golang1.27，不需要再替换
          test -d feeds/packages/lang/golang/golang1.27 || {
            echo "::error::feeds/packages 里没有 golang1.27，tailscale 会编不过"; exit 1; }
          echo "OK  golang1.27 由 openwrt-25.12 feed 提供"
          grep -E 'GO_VERSION|golang1\.27' feeds/packages/lang/golang/golang-version.mk 2>/dev/null | head -5 || true
          grep -q 'golang1\.27' feeds/packages/net/tailscale/Makefile && echo "OK  tailscale 依赖 golang1.27"

      - name: 应用编译配置
        run: |
          cp ax6.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- 目标设备 ---"
          grep -E '^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y' .config || {
            echo "::error::目标设备 redmi_ax6-stock 未启用（补丁未生效或设备名不匹配）"; exit 1; }
          echo "--- 内核版本 ---"
          grep -E '^CONFIG_LINUX_6_12' .config | head -3 || true

      # make defconfig 对"树里根本没有的包"是静默丢弃：一个字不报，配置文件里那行直接消失。
      # 第 13 轮就栽在这——ax6.config 请求了 kmod-nft-fullcone（只在 ImmortalWrt 树内维护），
      # defconfig 把它丢掉，可 luci-app-turboacc 的 ipk 依赖里仍写着 +kmod-nft-fullcone，
      # 于是白编 4 小时后在 package/install 报 "unable to select packages"。
      # 这里把"请求了但没进 .config"的包在开工 10 分钟内列出来，只告警不拦。
      - name: 自检配置是否被静默丢弃
        run: |
          set +e
          cd openwrt
          list_req() { grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$1" \
                         | sed -E 's/^CONFIG_PACKAGE_(.*)=y$/\1/' | sort -u; }
          list_req ../ax6.config > /tmp/req.txt
          list_req .config      > /tmp/got.txt
          comm -23 /tmp/req.txt /tmp/got.txt > /tmp/dropped.txt
          req=$(wc -l < /tmp/req.txt); got=$(wc -l < /tmp/got.txt); n=$(wc -l < /tmp/dropped.txt)
          echo "请求 $req 个包 → 进 .config $got 个，被静默丢弃 $n 个"
          if [ "$n" -gt 0 ]; then
            # 依赖了"不存在的包"的已选包，是最危险的一类：编译能走完，最后装包才炸
            echo "--- 丢弃清单 ---"; cat /tmp/dropped.txt
            echo "::warning::$n 个包请求了但树里没有（见 Summary 表格）"
            { echo "### 配置被静默丢弃的包（$n）"; echo
              echo "\`make defconfig\` 不会为这些包报错，只把它们从 .config 里删掉；"
              echo "若某个已选包的依赖里有它们，编译会在最后的 package/install 阶段失败。"; echo
              echo "| 包 |"; echo "|---|"
              sed 's/^/| `/' /tmp/dropped.txt | sed 's/$/` |/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OK  没有任何请求的包被丢弃"
          fi

      - name: 校验核心功能包已启用
        run: |
          set +e
          cd openwrt
          FAIL=0

          check() {  # $1=符号 $2=说明
            if grep -qE "^CONFIG_PACKAGE_$1=y" .config; then
              echo "OK    $1  ($2)"
            else
              echo "::error::$1 未启用（$2）"
              FAIL=1
            fi
          }
          warn() {
            if grep -qE "^CONFIG_PACKAGE_$1=y" .config; then
              echo "OK    $1"
            else
              echo "::warning::$1 未进入最终 config（界面/功能会缺）"
              echo "- ⚠️ $1 未启用" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "===== 硬性要求 ====="
          check kmod-wireguard "WireGuard 内核模块"
          check wireguard-tools "wg 命令"
          check luci-proto-wireguard "LuCI WireGuard 协议页"
          check rpcd-mod-wireguard "rpcd UCI 接口"
          check tailscale "tailscale"
          check kmod-tun "tailscale 依赖 /dev/net/tun"
          check kmod-qca-nss-drv "NSS 驱动"
          check kmod-qca-nss-ecm "NSS ECM 连接管理"
          check luci-base "LuCI 核心"

          echo "===== 预期增强项（缺失只告警）====="
          warn luci-ssl-openssl
          warn kmod-nf-nathelper
          warn kmod-nf-nathelper-extra
          warn kmod-nf-nathelper-rtsp
          # kmod-nft-fullcone / luci-app-turboacc 已从 ax6.config 移除（主线无该 kmod，
          # turboacc 的 NFT_FULLCONE 选项会硬依赖它），不再作为预期项检查。
          warn luci-app-wol
          warn luci-theme-argon
          warn luci-app-openclash
          warn luci-app-mosdns
          warn luci-app-vlmcsd
          warn luci-app-cpufreq
          warn autocore

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::核心功能包缺失，终止编译"
            exit 1
          fi

      # dl/ 是纯输入：make download 按 PKG_SOURCE 的文件名往里放 tarball，不参与编译判定，
      # 所以缓存它不会像 staging_dir 那样让别的包链到错的东西。
      # 必须放在「下载依赖源码」之前恢复：这一步之后 dl/ 才被填满，保存由本 action 的 post 步负责。
      # 换源码树后 dl 内容整体不同（qosmio 25.12 的 tarball 版本与旧树不一致），
      # 旧 key 一律不会命中，第一轮必然全量下载——这是预期行为。
      - name: 恢复 dl 缓存
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ax6build/openwrt/dl
          # 精确 key 由仓库状态算出：ax6.config 或本文件不变就命中上一次的归档、不产生新条目；
          # 变了也只是换一个 key，restore-keys 仍按前缀捞回旧 tarball，make download 只补缺的。
          key: dl-${{ hashFiles('ax6.config') }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            dl-

      - name: 下载依赖源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail
          echo "== 并行编译 (nproc=$(nproc)) =="
          if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "并行编译成功"
            exit 0
          fi
          echo "== 并行编译失败，串行 V=s 重试（保留首个错误现场） =="
          cp /tmp/build.log /tmp/build_parallel.log
          free -h; df -h /
          # 串行全量重编比并行慢 3 倍以上，必须限时：一旦把 job 顶到 350 分钟超时，
          # 下面的失败诊断、logs 分支、日志 artifact 全都不会执行，最需要日志时恰好没有。
          timeout 45m make -j1 V=s 2>&1 | tee /tmp/build_serial.log || true
          cp /tmp/build_serial.log /tmp/build.log
          exit 1

      - name: 失败诊断
        if: failure() || cancelled()
        run: |
          LOG=/tmp/build.log
          [ -f "$LOG" ] || LOG=/tmp/build_serial.log
          # 失败发生在编译之前（配置/校验步）时两个日志都不存在；此处必须兜底，
          # 否则后面 tail 一个不存在的文件会让本步自己也 exit 1，
          # 日志 artifact 与 job summary 全都拿不到（LibWrt 首轮就是这样丢了全部日志）。
          if [ ! -f "$LOG" ]; then
            {
              echo "## 编译失败诊断"
              echo ""
              echo "编译未启动：失败发生在前面的准备/配置/校验步骤，没有 build.log。"
              echo "请查看该 job 的 Annotations（::error:: 标注）定位具体原因。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=no-build-log::编译未启动，无 build.log，请看上一步的 ::error:: 标注"
            mkdir -p out
            echo "编译未启动，无 build.log。" > out/build-tail.log
            exit 0
          fi
          {
            echo "## 编译失败诊断"
            echo ""
            echo '**磁盘**'
            echo '```'
            df -h / /mnt 2>/dev/null | tail -4
            echo '```'
            echo '**内存**'
            echo '```'
            free -h | head -3
            echo '```'
            echo "### 匹配到的错误行（末尾 40 条）"
            echo '```'
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|fatal error|undefined reference|unable to select packages|breaks:|^Package .* is missing dependencies" "$LOG" 2>/dev/null | tail -40 || echo "(未匹配到关键字)"
            echo '```'
            echo "### 依赖冲突区块（若有）"
            echo '```'
            grep -n -B2 -A40 "unable to select packages" "$LOG" 2>/dev/null | head -80 || echo "(无)"
            echo '```'
            echo "### 日志末尾 120 行"
            echo '```'
            tail -120 "$LOG" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|undefined reference" "$LOG" 2>/dev/null \
            | tail -8 | while IFS= read -r l; do echo "::error title=build-error::$l"; done
          mkdir -p out
          tail -c 3000000 "$LOG" > out/build-tail.log 2>/dev/null || true
          echo "诊断已写入 job summary"

      - name: 发布失败日志到 logs 分支
        if: failure() || cancelled()
        run: |
          set +e
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/build_serial.log
          R=/tmp/failure-report.txt
          {
            echo "run_id : ${{ github.run_id }}"
            echo "commit : ${{ github.sha }}"
            echo "url    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time   : $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "########## unable to select packages ##########"
            grep -n -B2 -A80 "unable to select packages" "$LOG" | head -160
            echo
            echo "########## breaks ##########"
            grep -n -B1 -A12 "breaks:" "$LOG" | head -120
            echo
            echo "########## 错误行（末尾 80） ##########"
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|undefined reference|^Package .* is missing dependencies|Conflicting|WARNING: Makefile" "$LOG" | tail -80
            echo
            echo "########## 日志末尾 800 行 ##########"
            tail -800 "$LOG"
          } > "$R" 2>&1
          echo "报告大小: $(wc -c < "$R") 字节"
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git symbolic-ref HEAD refs/heads/logs
          git config user.email "ci@ax6build.local"
          git config user.name "ax6build-ci"
          cp "$R" "failure-${{ github.run_id }}.txt"
          git add -A
          git commit -q -m "failure log run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs && \
            echo "已发布到 logs 分支" || echo "发布失败（不影响主流程）"

      - name: 上传编译日志（仅失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -name "*sysupgrade.bin" -exec cp {} out/ \;
          find openwrt/bin/targets -name "*factory.ubi" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "sha256sums" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "config.buildinfo" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "*.manifest" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- 产物清单 ---"
          ls -lh out/
          sha256sum out/* || true
          # 量体积：给缓存策略留真实数据（只加打印，不新增步骤）
          echo "--- 缓存与下载体积 ---"
          du -sh openwrt/.ccache openwrt/dl 2>/dev/null || true
          echo "dl 文件数: $(ls openwrt/dl 2>/dev/null | wc -l)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6-nss-wireguard-firmware
          path: out/
          retention-days: 30

      # 失败也要留缓存：第 13 轮编了 4 小时死在最后的 package/install，而 actions/cache 的
      # post 步在 job 失败时被跳过（日志里 "Post 恢复 ccache ... skipped"）——等于每轮从冷
      # 缓存重来。拆成 restore + always() 的 save 两步。
      - name: 保存 ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /mnt/ax6build/openwrt/.ccache
          key: ccache-qosmio2512-${{ github.run_id }}

      - name: 保存 dl 缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /mnt/ax6build/openwrt/dl
          key: dl-${{ hashFiles('ax6.config') }}-${{ hashFiles('.github/workflows/build.yml') }}
