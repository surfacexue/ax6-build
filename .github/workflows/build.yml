name: Build AX6 NSS Firmware
# trigger-marker: 2

# 云编译 TerryLip/AX6NSS-qosmio 的 Redmi AX6 (stock) 固件，
# 相对上游只做了一处改动：启用 WireGuard 四个包。
#
# 用法：仓库 Actions 页 -> Build AX6 NSS Firmware -> Run workflow

on:
  # 推送即编译（无需 token / gh CLI）
  push:
    branches: [main]
    paths:
      - 'ax6.config'
      - '.github/workflows/build.yml'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支/标签（默认作者默认分支）'
        required: false
        default: 'qualcommax-6.x-nss-wifi'

jobs:
  build:
    runs-on: ubuntu-22.04
    # 失败时要把日志推到 logs 分支（公开可读），因此需要写权限
    permissions:
      contents: write
    # 新提交自动取消仍在运行的旧任务，避免白白占额度
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # GitHub 单个 job 上限 6 小时，留 10 分钟余量
    timeout-minutes: 350
    env:
      # push 触发时 inputs 为空，这里兜底成作者默认分支
      SOURCE_REF: ${{ github.event.inputs.source_ref || 'qualcommax-6.x-nss-wifi' }}
      # ccache 放到 74G 临时盘，避免挤占根分区
      CCACHE_DIR: /mnt/ax6build/.ccache

    steps:
      # 注意：必须先检出本仓库，才能拿到 ax6.config；
      # 作者源码用 git clone 单独拉到 openwrt/ 子目录。
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          uname -a
          echo "CPU 核心: $(nproc)"
          free -h
          df -h /

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/microsoft \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo apt-get -y purge -qq '^llvm-.*' '^mysql-.*' '^php.*' 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget subversion ccache time
          df -h /

      - name: 拉取固件源码
        run: |
          # runner 根分区只有 ~14G（清理后约 30G），qualcommax + NSS 全量编译
          # 加上 ccache 很容易顶满；另有一块 74G 临时盘挂在 /mnt，把构建树放过去。
          BUILD_ROOT=/mnt/ax6build
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT/.ccache"
          echo "--- 磁盘 ---"
          df -h / /mnt
          echo "目标分支: $SOURCE_REF"
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/TerryLip/AX6NSS-qosmio.git "$BUILD_ROOT/openwrt"
          ln -sfn "$BUILD_ROOT/openwrt" openwrt
          cd openwrt
          echo "--- 实际路径 ---"
          pwd -P
          echo "--- 源码 HEAD ---"
          git log -1 --oneline
          du -sh .

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: /mnt/ax6build/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 替换 LuCI 面板与 golang（作者要求，改用 git 替代已停服的 svn）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          # GitHub 已于 2024 年停止 Subversion 支持，作者 README 里的
          # `svn export https://github.com/...` 现在必然 404，改用 git。
          #
          # 【为什么不能直接用分支 HEAD】
          #   - master：把模板编译成 ucode 字节码（format 0x02），要求
          #     ucode >= 2026.02.27，本树 ucode 是 2025.05.11 → 依赖冲突
          #   - 24.10 / 25.12：luci-base 依赖 +ucode-mod-html，而本树的
          #     ucode 只编 debug/fs/log/math/resolv/rtnl/socket/struct/ubus/
          #     uci/uloop/digest，根本没有 html 模块 → apk 报
          #     "unable to select packages"（package/install Error 53）
          # 因此改为「回溯时间点」：从近到远找第一个没有 ucode-mod-html 依赖的
          # 提交，使 LuCI 与源码树的 ucode 年份对齐，避开上面两种情况。
          #
          # 另外只做"原位替换"，不删除 v2ray-geodata：本配置启用了
          # CONFIG_PACKAGE_v2ray-geoip / v2ray-geosite（openclash 依赖），删了会断链。
          LUCI_TMP="$RUNNER_TEMP/luci-src"
          rm -rf "$LUCI_TMP"
          # blobless 克隆：只取提交与树对象，文件按需拉取，体积可控
          git clone --filter=blob:none --no-checkout --single-branch \
            -b master https://github.com/immortalwrt/luci "$LUCI_TMP"
          git -C "$LUCI_TMP" sparse-checkout init --cone
          git -C "$LUCI_TMP" sparse-checkout set modules/luci-base modules/luci-mod-status

          # 从近到远回溯时间点，选第一个「luci-base 不依赖 ucode-mod-html」的提交。
          # 每个候选只拉取两个模块目录的小文件，校验很快，失败也不会浪费整轮编译。
          LUCI_REF=""
          for D in 2025-12-01 2025-09-01 2025-06-01 2025-03-01 2024-12-01; do
            SHA=$(git -C "$LUCI_TMP" rev-list -1 --before="$D" origin/master)
            [ -n "$SHA" ] || continue
            git -C "$LUCI_TMP" checkout -q "$SHA" 2>/dev/null || continue
            if ! grep -q 'ucode-mod-html' "$LUCI_TMP/modules/luci-base/Makefile" 2>/dev/null; then
              LUCI_REF="$SHA"
              echo "选用 $D 之前的提交 ${SHA:0:10}"
              break
            fi
            echo "跳过 $D 之前的 ${SHA:0:10}（仍依赖 ucode-mod-html）"
          done
          if [ -z "$LUCI_REF" ]; then
            echo "::error::回溯所有候选提交都依赖 ucode-mod-html，需人工指定 LUCI 版本"
            exit 1
          fi
          git -C "$LUCI_TMP" log -1 --format='LuCI 提交: %h %ad %s' --date=short

          rm -rf feeds/luci/modules/luci-base feeds/luci/modules/luci-mod-status
          cp -a "$LUCI_TMP/modules/luci-base"        feeds/luci/modules/luci-base
          cp -a "$LUCI_TMP/modules/luci-mod-status"  feeds/luci/modules/luci-mod-status

          # 【反向校验】替换后的 luci-base 不得再依赖本树没有的包/版本
          if grep -q 'ucode-mod-html' feeds/luci/modules/luci-base/Makefile; then
            echo "::error::替换后的 luci-base 仍依赖 ucode-mod-html，源码树无法满足"
            exit 1
          fi
          echo "OK  已确认 luci-base 不再依赖 ucode-mod-html"
          if grep -qE 'ucode *\(>= *2026' feeds/luci/modules/luci-base/Makefile; then
            echo "::error::luci-base 仍要求 ucode >= 2026，与源码树 ucode 2025.05.11 冲突"
            exit 1
          fi
          echo "OK  无 ucode 版本下限约束"

          # golang 换 sbwml 的 23.x 分支（原地替换，package/feeds 下的软链保持不变）
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 https://github.com/sbwml/packages_lang_golang \
            -b 23.x feeds/packages/lang/golang

          rm -rf ./tmp

          # 硬校验：三个替换件必须就位，否则直接失败而不是带病往下跑
          for f in feeds/luci/modules/luci-base/Makefile \
                   feeds/luci/modules/luci-mod-status/Makefile \
                   feeds/packages/lang/golang/golang/Makefile; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "::error::$f 缺失"; exit 1; fi
          done
          ls -d package/feeds/luci/luci-base package/feeds/luci/luci-mod-status package/feeds/packages/golang

      - name: 应用编译配置
        run: |
          cp ax6.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- 目标设备 ---"
          grep -E '^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y' .config || {
            echo "::error::目标设备 redmi_ax6-stock 未启用"; exit 1; }

      - name: 校验 WireGuard 已启用
        run: |
          cd openwrt
          COUNT=$(grep -cE '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|rpcd-mod-wireguard)=y' .config || true)
          grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|rpcd-mod-wireguard)=y' .config || true
          echo "命中行数: $COUNT（应为 4）"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::WireGuard 配置未全部启用，终止编译"
            exit 1
          fi

      - name: 下载依赖源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail
          echo "== 并行编译 (nproc=$(nproc)) =="
          if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "并行编译成功"
            exit 0
          fi
          echo "== 并行编译失败，串行 V=s 重试（保留首个错误现场） =="
          cp /tmp/build.log /tmp/build_parallel.log
          free -h; df -h /
          make -j1 V=s 2>&1 | tee /tmp/build_serial.log || true
          cp /tmp/build_serial.log /tmp/build.log
          exit 1

      # 失败时把关键错误写进 job summary + annotation
      # annotation 与 check-run summary 无需登录即可通过 API 读取，便于远程诊断
      - name: 失败诊断
        if: failure()
        run: |
          LOG=/tmp/build.log
          [ -f "$LOG" ] || LOG=/tmp/build_serial.log
          {
            echo "## 编译失败诊断"
            echo ""
            echo '**磁盘**'
            echo '```'
            df -h / /mnt 2>/dev/null | tail -4
            echo '```'
            echo '**内存**'
            echo '```'
            free -h | head -3
            echo '```'
            echo "### 匹配到的错误行（末尾 40 条）"
            echo '```'
            grep -nE "error:|Error [0-9]|No space left|Killed|make.*\*\*\*|fatal error|undefined reference|unable to select packages|breaks:|missing dependencies" "$LOG" 2>/dev/null | tail -40 || echo "(未匹配到关键字)"
            echo '```'
            echo "### 依赖冲突区块（若有）"
            echo '```'
            grep -n -B2 -A40 "unable to select packages" "$LOG" 2>/dev/null | head -80 || echo "(无)"
            echo '```'
            echo "### 日志末尾 120 行"
            echo '```'
            tail -120 "$LOG" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE "error:|Error [0-9]|No space left|Killed|make.*\*\*\*|undefined reference" "$LOG" 2>/dev/null \
            | tail -8 | while IFS= read -r l; do echo "::error title=build-error::$l"; done
          mkdir -p out
          tail -c 3000000 "$LOG" > out/build-tail.log 2>/dev/null || true
          echo "诊断已写入 job summary"

      # 把失败日志摘要推到 logs 分支：仓库是公开的，raw 链接无需登录即可读取，
      # 省去「下载 artifact / 截图日志」这一环。
      - name: 发布失败日志到 logs 分支
        if: failure()
        run: |
          set +e
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/build_serial.log
          R=/tmp/failure-report.txt
          {
            echo "run_id : ${{ github.run_id }}"
            echo "commit : ${{ github.sha }}"
            echo "url    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time   : $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "########## unable to select packages ##########"
            grep -n -B2 -A80 "unable to select packages" "$LOG" | head -160
            echo
            echo "########## breaks ##########"
            grep -n -B1 -A12 "breaks:" "$LOG" | head -120
            echo
            echo "########## 错误行（末尾 80） ##########"
            grep -nE "error:|Error [0-9]|No space left|Killed|make.*\*\*\*|undefined reference|missing dependencies|Conflicting|WARNING: Makefile" "$LOG" | tail -80
            echo
            echo "########## 日志末尾 800 行 ##########"
            tail -800 "$LOG"
          } > "$R" 2>&1
          echo "报告大小: $(wc -c < "$R") 字节"
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git symbolic-ref HEAD refs/heads/logs
          git config user.email "ci@ax6build.local"
          git config user.name "ax6build-ci"
          cp "$R" "failure-${{ github.run_id }}.txt"
          git add -A
          git commit -q -m "failure log run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs && \
            echo "已发布到 logs 分支" || echo "发布失败（不影响主流程）"

      - name: 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -name "*sysupgrade.bin" -exec cp {} out/ \;
          find openwrt/bin/targets -name "*factory.ubi" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "sha256sums" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "config.buildinfo" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- 产物清单 ---"
          ls -lh out/
          sha256sum out/* || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6-nss-wireguard-firmware
          path: out/
          retention-days: 30
