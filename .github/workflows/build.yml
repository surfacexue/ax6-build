name: Build AX6 NSS Firmware
# trigger-marker: 2

# 云编译 TerryLip/AX6NSS-qosmio 的 Redmi AX6 (stock) 固件，
# 相对上游只做了一处改动：启用 WireGuard 四个包。
#
# 用法：仓库 Actions 页 -> Build AX6 NSS Firmware -> Run workflow

on:
  # 推送即编译（无需 token / gh CLI）
  push:
    branches: [main]
    paths:
      - 'ax6.config'
      - '.github/workflows/build.yml'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支/标签（默认作者默认分支）'
        required: false
        default: 'qualcommax-6.x-nss-wifi'

jobs:
  build:
    runs-on: ubuntu-22.04
    # 失败时要把日志推到 logs 分支（公开可读），因此需要写权限
    permissions:
      contents: write
    # 新提交自动取消仍在运行的旧任务，避免白白占额度
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    # GitHub 单个 job 上限 6 小时，留 10 分钟余量
    timeout-minutes: 350
    env:
      # push 触发时 inputs 为空，这里兜底成作者默认分支
      SOURCE_REF: ${{ github.event.inputs.source_ref || 'qualcommax-6.x-nss-wifi' }}
      # ccache 放到 74G 临时盘，避免挤占根分区。
      # 关键：OpenWrt 的 rules.mk 第 355 行会强制
      #   export CCACHE_DIR := $(if $(CONFIG_CCACHE_DIR), $(CONFIG_CCACHE_DIR), $(TOPDIR)/.ccache)
      # 而 ax6.config 里 CONFIG_CCACHE_DIR=""，TOPDIR 就是 /mnt/ax6build/openwrt，
      # 所以 ccache 实际写在 /mnt/ax6build/openwrt/.ccache。job 级的 env 会被 make 覆盖，
      # 因此下面的 env 与 actions/cache 的 path 都必须指向这个真实目录，否则缓存每轮白传。
      CCACHE_DIR: /mnt/ax6build/openwrt/.ccache

    steps:
      # 注意：必须先检出本仓库，才能拿到 ax6.config；
      # 作者源码用 git clone 单独拉到 openwrt/ 子目录。
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          uname -a
          echo "CPU 核心: $(nproc)"
          free -h
          df -h /

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup /opt/microsoft \
                      /usr/local/share/powershell /usr/share/miniconda
          sudo apt-get -y purge -qq '^llvm-.*' '^mysql-.*' '^php.*' 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget subversion ccache time
          df -h /

      - name: 拉取固件源码
        run: |
          # runner 根分区只有 ~14G（清理后约 30G），qualcommax + NSS 全量编译
          # 加上 ccache 很容易顶满；另有一块 74G 临时盘挂在 /mnt，把构建树放过去。
          BUILD_ROOT=/mnt/ax6build
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT/.ccache"
          echo "--- 磁盘 ---"
          df -h / /mnt
          echo "目标分支: $SOURCE_REF"
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/TerryLip/AX6NSS-qosmio.git "$BUILD_ROOT/openwrt"
          ln -sfn "$BUILD_ROOT/openwrt" openwrt
          cd openwrt
          echo "--- 实际路径 ---"
          pwd -P
          echo "--- 源码 HEAD ---"
          git log -1 --oneline
          du -sh .

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          # 与 rules.mk 里 CCACHE_DIR 的落盘位置一致（$(TOPDIR)/.ccache）
          path: /mnt/ax6build/openwrt/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: 更新 feeds（luci 固定到 immortalwrt openwrt-25.12）
        run: |
          # 先把 ccache 容量钉住：本树 rules.mk 强制 CCACHE_NOCOMPRESS=true（缓存不压缩），
          # 不设上限会一路涨到默认值，与 74G 构建树抢空间。放在恢复后执行，避免被缓存里的
          # 旧 ccache.conf 覆盖。这里不新增步骤，保持下文「第 N 步」的编号不变。
          mkdir -p /mnt/ax6build/openwrt/.ccache
          ccache --max-size=4G
          echo "--- ccache 配置 ---"
          (ccache --show-config 2>/dev/null || ccache -p) | grep -iE 'max_size|compress' || true
          cd openwrt
          # 【为什么要换 luci feed 的来源】
          # 作者 README 要求用 immortalwrt 的 LuCI 覆盖源码树自带的官方 LuCI
          # （源码树 feeds 指向 openwrt/project/luci，其 master 一直在跑）。
          # 但 LuCI 的版本约束写在 feed 根部的 luci.mk 里，只换 modules/ 下的
          # 几个模块没用：
          #   - master 的 luci.mk 有 LUCI_UT_MIN_UCODE=2026.02.27，
          #     会把模板编成 ucode 字节码（format 0x02），而本树 ucode 是
          #     2025.05.11 → package/install 报
          #     "ucode-2025.05.11 breaks luci-base[...ucode>=2026.02.27]"
          #   - openwrt-25.12 的 luci.mk 完全没有 UT/字节码约束，
          #     且 luci-base 依赖的 ucode-mod-html 由 LuCI 自己的
          #     contrib/package/ucode-mod-html 提供（不是主线 ucode 的模块），
          #     所以依赖可以正常解析
          # 因此把整个 luci feed 指到 immortalwrt 的 openwrt-25.12 分支。
          if [ -f feeds.conf ]; then rm -f feeds.conf; fi
          sed -i 's#^src-git luci .*#src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12#' feeds.conf.default
          echo "--- feeds.conf.default 中的 luci 行 ---"
          grep -n '^src-git luci' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 替换 golang 并校验 LuCI 来源（作者要求，改用 git 替代已停服的 svn）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          # LuCI 的来源已在上一步通过 feeds.conf.default 固定为 immortalwrt
          # 的 openwrt-25.12 分支，这里只做「就地校验 + golang 替换」。
          # 只替换 modules/ 下几个模块是不够的：ucode 版本约束写在 feed 根部的
          # luci.mk 里，换模块不换 luci.mk，约束依然生效。
          test -f feeds/luci/luci.mk || { echo "::error::找不到 feeds/luci/luci.mk，luci feed 未正确拉取"; exit 1; }

          # 校验 1：luci.mk 不得含字节码约束（含则表示要求 ucode >= 2026.02.27）
          if grep -q 'LUCI_UT_MIN_UCODE' feeds/luci/luci.mk; then
            echo "::error::luci.mk 含 LUCI_UT_MIN_UCODE，与源码树 ucode 2025.05.11 冲突"
            exit 1
          fi
          echo "OK  luci.mk 无 ucode 字节码约束"

          # 校验 2：LuCI 依赖的 ucode-mod-html 由 luci feed 的 contrib 提供，
          # 缺了会在 package/install 阶段以 Error 53 失败（apk 无法解析依赖）
          if [ ! -f feeds/luci/contrib/package/ucode-mod-html/Makefile ]; then
            echo "::error::缺少 feeds/luci/contrib/package/ucode-mod-html，依赖无法解析"
            exit 1
          fi
          echo "OK  ucode-mod-html 由 feeds/luci/contrib 提供"

          # 校验 3：打印 LuCI 实际版本，便于事后核对
          grep -nE '^PKG_GITBRANCH|^LUCI_BRANCH' feeds/luci/luci.mk | head -3 || true
          git -C feeds/luci log -1 --format='LuCI 提交: %h %ad %s' --date=short 2>/dev/null || true

          # golang 换 sbwml 的 27.x 分支（原地替换，package/feeds 下的软链保持不变）
          # 版本下限由 tailscale 决定，不是随便选的：
          #   tailscale 1.104.6 的 go.mod 声明 `go 1.27.3`，并使用 Go 1.24 才引入的 tool 块
          #   Go 1.23 → go: unknown block type: tool
          #   Go 1.24~1.26 → go.mod requires go >= 1.27.3（GOTOOLCHAIN=local，不会自动下载）
          # 降 tailscale 版本救不了：1.88.4 都要 go 1.25.1，1.96.5 要 1.26.1
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 https://github.com/sbwml/packages_lang_golang \
            -b 27.x feeds/packages/lang/golang

          # 硬校验 Go 版本，避免又一次跑到第 13 步才失败
          GO_VER=$(sed -n 's/^GO_VERSION_MAJOR_MINOR:=//p' feeds/packages/lang/golang/golang/Makefile)
          echo "Go 主版本: $GO_VER（tailscale 1.104.6 要求 >= 1.27）"
          case "$GO_VER" in
            1.2[7-9]|1.[3-9]*) echo "OK  Go 版本满足 tailscale 要求" ;;
            *) echo "::error::Go $GO_VER 过低，tailscale 会因 go.mod 要求 1.27.3 而失败"; exit 1 ;;
          esac

          rm -rf ./tmp

          # 硬校验：替换件必须就位，否则直接失败而不是带病往下跑
          for f in feeds/luci/modules/luci-base/Makefile \
                   feeds/luci/modules/luci-mod-status/Makefile \
                   feeds/packages/lang/golang/golang/Makefile; do
            if [ -f "$f" ]; then echo "OK  $f"; else echo "::error::$f 缺失"; exit 1; fi
          done
          ls -d package/feeds/luci/luci-base package/feeds/luci/luci-mod-status package/feeds/packages/golang

      - name: 应用编译配置
        run: |
          cp ax6.config openwrt/.config
          cd openwrt
          make defconfig
          echo "--- 目标设备 ---"
          grep -E '^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y' .config || {
            echo "::error::目标设备 redmi_ax6-stock 未启用"; exit 1; }

      - name: 校验 WireGuard 与 tailscale 已启用
        run: |
          cd openwrt
          COUNT=$(grep -cE '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|rpcd-mod-wireguard)=y' .config || true)
          grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|rpcd-mod-wireguard)=y' .config || true
          echo "WireGuard 命中行数: $COUNT（应为 4）"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::WireGuard 配置未全部启用，终止编译"
            exit 1
          fi
          # tailscale 需要在 /etc/config 之外保留状态，且依赖 kmod-tun
          TS=$(grep -cE '^CONFIG_PACKAGE_tailscale=y' .config || true)
          TUN=$(grep -cE '^CONFIG_PACKAGE_kmod-tun=y' .config || true)
          echo "tailscale=$TS（应为 1）  kmod-tun=$TUN（应为 1）"
          if [ "$TS" -lt 1 ] || [ "$TUN" -lt 1 ]; then
            echo "::error::tailscale 或 kmod-tun 未启用，终止编译"
            exit 1
          fi

      - name: 下载依赖源码
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          set -o pipefail
          echo "== 并行编译 (nproc=$(nproc)) =="
          if make -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "并行编译成功"
            exit 0
          fi
          echo "== 并行编译失败，串行 V=s 重试（保留首个错误现场） =="
          cp /tmp/build.log /tmp/build_parallel.log
          free -h; df -h /
          # 串行全量重编比并行慢 3 倍以上，必须限时：一旦把 job 顶到 350 分钟超时，
          # 下面的失败诊断、logs 分支、日志 artifact 全都不会执行，最需要日志时恰好没有。
          timeout 45m make -j1 V=s 2>&1 | tee /tmp/build_serial.log || true
          cp /tmp/build_serial.log /tmp/build.log
          exit 1

      # 失败时把关键错误写进 job summary + annotation
      # annotation 与 check-run summary 无需登录即可通过 API 读取，便于远程诊断
      - name: 失败诊断
        if: failure() || cancelled()
        run: |
          LOG=/tmp/build.log
          [ -f "$LOG" ] || LOG=/tmp/build_serial.log
          {
            echo "## 编译失败诊断"
            echo ""
            echo '**磁盘**'
            echo '```'
            df -h / /mnt 2>/dev/null | tail -4
            echo '```'
            echo '**内存**'
            echo '```'
            free -h | head -3
            echo '```'
            echo "### 匹配到的错误行（末尾 40 条）"
            echo '```'
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|fatal error|undefined reference|unable to select packages|breaks:|^Package .* is missing dependencies" "$LOG" 2>/dev/null | tail -40 || echo "(未匹配到关键字)"
            echo '```'
            echo "### 依赖冲突区块（若有）"
            echo '```'
            grep -n -B2 -A40 "unable to select packages" "$LOG" 2>/dev/null | head -80 || echo "(无)"
            echo '```'
            echo "### 日志末尾 120 行"
            echo '```'
            tail -120 "$LOG" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|undefined reference" "$LOG" 2>/dev/null \
            | tail -8 | while IFS= read -r l; do echo "::error title=build-error::$l"; done
          mkdir -p out
          tail -c 3000000 "$LOG" > out/build-tail.log 2>/dev/null || true
          echo "诊断已写入 job summary"

      # 把失败日志摘要推到 logs 分支：仓库是公开的，raw 链接无需登录即可读取，
      # 省去「下载 artifact / 截图日志」这一环。
      - name: 发布失败日志到 logs 分支
        if: failure() || cancelled()
        run: |
          set +e
          LOG=/tmp/build.log
          [ -s "$LOG" ] || LOG=/tmp/build_serial.log
          R=/tmp/failure-report.txt
          {
            echo "run_id : ${{ github.run_id }}"
            echo "commit : ${{ github.sha }}"
            echo "url    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time   : $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "########## unable to select packages ##########"
            grep -n -B2 -A80 "unable to select packages" "$LOG" | head -160
            echo
            echo "########## breaks ##########"
            grep -n -B1 -A12 "breaks:" "$LOG" | head -120
            echo
            echo "########## 错误行（末尾 80） ##########"
            grep -nE "ERROR:|error:|Error [0-9]|failed to build|Collected errors|No space left|Killed|make.*\*\*\*|undefined reference|^Package .* is missing dependencies|Conflicting|WARNING: Makefile" "$LOG" | tail -80
            echo
            echo "########## 日志末尾 800 行 ##########"
            tail -800 "$LOG"
          } > "$R" 2>&1
          echo "报告大小: $(wc -c < "$R") 字节"
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git symbolic-ref HEAD refs/heads/logs
          git config user.email "ci@ax6build.local"
          git config user.name "ax6build-ci"
          cp "$R" "failure-${{ github.run_id }}.txt"
          git add -A
          git commit -q -m "failure log run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs && \
            echo "已发布到 logs 分支" || echo "发布失败（不影响主流程）"

      - name: 上传编译日志（仅失败时）
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets -name "*sysupgrade.bin" -exec cp {} out/ \;
          find openwrt/bin/targets -name "*factory.ubi" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "sha256sums" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "config.buildinfo" -exec cp {} out/ \; 2>/dev/null || true
          find openwrt/bin/targets -name "*.manifest" -exec cp {} out/ \; 2>/dev/null || true
          echo "--- 产物清单 ---"
          ls -lh out/
          sha256sum out/* || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ax6-nss-wireguard-firmware
          path: out/
          retention-days: 30
